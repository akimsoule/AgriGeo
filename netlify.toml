[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Lecteur Excel (dépendances CommonJS) : livré tel quel plutôt que fondu dans le bundle ESM.
  external_node_modules = ["read-excel-file"]

# `netlify dev` : lance Vite et expose les fonctions (/api/dashboard) sur http://localhost:8888
[dev]
  command = "npm run dev"
  targetPort = 8080
  port = 8888

# Application monopage : toute route inconnue renvoie index.html (React Router prend le relais).
# Les fichiers existants et les fonctions (/api/*) ont priorité sur cette règle.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
